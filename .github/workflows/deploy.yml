name: Deploy IMG-PDF Web App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest


    steps:

      # Download repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5


      # Upload only Web Application
      - name: Upload Web App
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Web-App


      # Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4